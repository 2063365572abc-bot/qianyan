name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qianyan
          POSTGRES_DB: qianyan_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qianyan -d qianyan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://qianyan:ci-only-password@127.0.0.1:5432/qianyan_test
      APP_PUBLIC_URL: http://testserver
      SESSION_SECRET: ci-session-secret-never-use-in-production
      NEBIUS_API_KEY: ""
      WECOM_APP_SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run python -m app.migrate
        working-directory: backend
      - run: uv run pytest
        working-directory: backend
      - run: uv run python ../scripts/preflight.py --env ../.env.example
        working-directory: backend
        # The deliberately incomplete example must fail deployment validation.
        id: reject_example
        continue-on-error: true
      - run: test '${{ steps.reject_example.outcome }}' = failure

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  containers:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate isolated development credentials
        run: python3 scripts/bootstrap-local.py
      - name: Build and start the actual container stack
        run: docker compose --env-file .env -f infra/compose.yaml -f infra/compose.dev.yaml up --build --detach --wait --wait-timeout 180
      - name: Wait for the independent worker
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://localhost:8080/api/health/ready", timeout=3) as response:
                      ready = json.load(response)
                  if ready.get("database") and ready.get("worker_online"):
                      print("Container database and independent worker ready")
                      break
              except (OSError, ValueError):
                  pass
              time.sleep(2)
          else:
              raise SystemExit("Container readiness timed out")
          PY
      - name: Exercise real HTTP through Caddy
        run: node frontend/tests/api-contract.mjs
        env:
          QIANYAN_TEST_URL: http://localhost:8080
      - name: Stop only the ephemeral CI stack
        if: always()
        run: docker compose --env-file .env -f infra/compose.yaml -f infra/compose.dev.yaml down --volumes --remove-orphans
